name: Trigger E2E
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Write PR info to artifact
        run: |
          mkdir -p pr-info
          echo "${{ github.event.pull_request.head.repo.full_name }}" > pr-info/repo_name
          echo "${{ github.event.pull_request.head.sha }}" > pr-info/head_sha
      - uses: actions/upload-artifact@v4
        with:
          name: pr-info
          path: pr-info/
