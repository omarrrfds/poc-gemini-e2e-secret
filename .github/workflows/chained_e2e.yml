name: Chained E2E
on:
  workflow_run:
    workflows: ["Trigger E2E"]
    types: [completed]

jobs:
  run_e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Download PR info artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a => a.name === "pr-info");
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: "zip",
            });
            require("fs").writeFileSync("pr-info.zip", Buffer.from(download.data));
      - run: unzip pr-info.zip -d pr-info
      - name: Read repo_name/head_sha
        id: info
        run: |
          echo "repo_name=$(cat pr-info/repo_name)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(cat pr-info/head_sha)" >> "$GITHUB_OUTPUT"
      - name: Checkout untrusted fork code (THIS IS THE VULNERABLE STEP)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.info.outputs.repo_name }}
          ref: ${{ steps.info.outputs.head_sha }}
          token: ''
      - name: Run fork's own "integration test" WITH the secret present
        env:
          POC_SECRET: ${{ secrets.POC_SECRET }}
        run: node test-integration.js
